[pytest]
# Default: run the fast mocked suite under tests/. The integration suite under
# tests_integration/ requires a live pgvector container and is opt-in via the
# Run-IntegrationTests.ps1 wrapper (or `pytest tests_integration/` after
# ensuring DATABASE_URL points at a real DB).
testpaths = tests
markers =
    integration: tests that require a live pgvector DB (run via Run-IntegrationTests.ps1)
